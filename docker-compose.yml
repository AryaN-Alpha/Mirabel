services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.6.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn mirabel.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: celery -A mirabel worker -l info --concurrency=2

  beat:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: celery -A mirabel beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  chroma_data:
